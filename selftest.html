const out = document.getElementById("out");
let ngCount = 0;

const esc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function section(title, lines) {
  const h = document.createElement("h2"); h.textContent = title; out.append(h);
  const p = document.createElement("pre"); p.innerHTML = lines.join("\n"); out.append(p);
}
const mark = ok => { if (!ok) ngCount++; return ok ? `<span class="ok">PASS</span>` : `<span class="ng">FAIL</span>`; };

/* 各要素をなぜそう採ったのか。ui.js の reason() と同じ考え方 */
function why(d) {
  if (d.implied)          return `「${d.impliedFrom}」に含まれるものとして加点`;
  if (d.hit && d.match)   return `「${d.match.text}」が該当` +
                                 (d.match.how ? `（${d.match.how}照合）` : "") +
                                 (d.match.spread ? "（割り込みを許して照合）" : "");
  return "";
}
const brief = s => s.detail.map(d => (d.hit ? "○" : "×") + d.label).join("  ");

/* ══════ A. 解答例と別解は満点か（とりこぼし） ══════ */
{
  const lines = [];
  for (const c of CASES) {
    for (const [tag, text] of [["解答例", c.answer], ["別解", c.variant]]) {
      if (!text) continue;
      const s = scoreCase(text, c.points);
      if (s.pct < 100) lines.push(
        `${mark(false)} ${c.id} ${tag} ${s.earned}/${s.full}  落ち: ` +
        esc(s.detail.filter(d => !d.hit).map(d => d.label).join(" / ")));
    }
  }
  if (!lines.length) lines.push(`${mark(true)} 全 ${CASES.length} 問、解答例・別解ともに満点`);
  section("A. 解答例・別解の自己採点", lines);
}

/* ══════ B. impliedBy のラベルが実在するか ══════ */
{
  const lines = [];
  for (const c of CASES) {
    const labels = new Set(c.points.map(p => p.label));
    for (const p of c.points) {
      if (!p.impliedBy) continue;
      for (const l of p.impliedBy) {
        if (labels.has(l)) lines.push(`${mark(true)} ${c.id} 「${esc(p.label)}」 ← 「${esc(l)}」`);
        else               lines.push(`${mark(false)} ${c.id} 「${esc(p.label)}」の impliedBy「${esc(l)}」に対応する要素がない`);
      }
    }
  }
  if (!lines.length) lines.push(`<span class="dim">impliedBy を使っている要素はない</span>`);
  section("B. impliedBy のラベル整合", lines);
}

/* ══════ C. 中身のない解答で点が入らないか ══════ */
{

    return `${mark(worst.s.pct <= 40)} 最大 ${worst.s.earned}/${worst.s.full} (${worst.id})  ${esc(j)}`;
  });
  section("C. 無関係な解答", lines);
}

/* ══════ E. 他問の解答で点が入る要素（緩い語の目安） ══════ */
{
  const corpus = [];
  for (const c of CASES) {
    if (c.answer)  corpus.push({id: c.id, text: c.answer});
    if (c.variant) corpus.push({id: c.id, text: c.variant});
  }
  const rows = [];
  for (const c of CASES) {
    for (const p of c.points) {
      const hits = new Set();
      for (const src of corpus) {
        if (src.id === c.id) continue;
        if (scoreCase(src.text, [p]).earned > 0) hits.add(src.id);
      }
      if (hits.size >= 3) rows.push({n: hits.size, id: c.id, label: p.label, pt: p.point, hits});
    }
  }
  rows.sort((a, b) => b.n - a.n);
  const lines = rows.length
    ? [`<span class="dim">他問の解答例・別解 ${corpus.length} 本のうち、3問以上で当たってしまう要素。`
       + `その問題を解いている限りは実害が出ないこともあるが、語が緩い目安になる。</span>`]
       .concat(rows.map(r => `  [${r.n}問] ${r.id} 「${esc(r.label)}」 ${r.pt}点`))
    : [`${mark(true)} 3問以上に当たる要素はない`];
  section("E. 語が緩い要素の目安", lines);
}

/* ══════ F. 判例○×のデータ整合 ══════ */
{
  const lines = [];
  const ids = new Set(), keys = new Set();
  let items = 0, maru = 0, batsu = 0;
  for (const h of HANREI) {
    const need = ["id","field","theme","topic","caseName","cite","facts","commentary"];
    const miss = need.filter(k => !h[k]);
    lines.push(`${mark(!miss.length)} ${h.id} 必須項目` + (miss.length ? `  <span class="ng">欠け: ${miss.join(" ")}</span>` : ""));
    lines.push(`${mark(!ids.has(h.id))} ${h.id} idが一意`);
    ids.add(h.id);
    // 出典は「最大判令2.11.25」の形。あとから原典に当たれるようにするため
    lines.push(`${mark(/^最(大)?(判|決)(昭|平|令)\d+\.\d+\.\d+$/.test(h.cite))} ${h.id} 出典の書式 ${esc(h.cite)}`);
    lines.push(`${mark(Array.isArray(h.items) && h.items.length >= 2)} ${h.id} 主張が2件以上（${h.items ? h.items.length : 0}件）`);
    (h.items || []).forEach((it, i) => {
      items++; it.ok ? maru++ : batsu++;
      const key = `${h.id}#${i}`;
      lines.push(`${mark(typeof it.ok === "boolean")} ${key} ok が真偽値`);
      lines.push(`${mark(!!it.claim && !!it.why)} ${key} claim と why がある`);
      // 主張の中に「判例に照らし」などの設問文が混ざっていないこと。主張だけを置く
      lines.push(`${mark(!/でしょうか|ですか|正しいか/.test(it.claim))} ${key} 主張に設問文が混ざっていない`);
      // 誤りの主張には、どこがどう違うのかが要る。「×」だけでは学習にならない
      lines.push(`${mark(it.ok || it.why.length >= 30)} ${key} 誤りの主張に理由がある（${it.why.length}字）`);
      // 本試験の肢は平均101字（令和6年問6・令和7年問4の実測）。
      // 平易に書くと判決文を読み解く負荷が抜け落ちるので、下限を80字に置く
      lines.push(`${mark(it.claim.length >= 80)} ${key} 判決文型が80字以上（${it.claim.length}字）`);
      lines.push(`${mark(!!it.plain && it.plain.length < it.claim.length)} ${key} 平易型が判決文型より短い（${it.plain ? it.plain.length : 0}字）`);
      lines.push(`${mark(!keys.has(key))} ${key} keyが一意`);
      keys.add(key);
    });
  }
  lines.push(`<span class="dim">判例 ${HANREI.length} 件 / 主張 ${items} 件（○ ${maru} ／ × ${batsu}）</span>`);
  // ○ばかり、×ばかりだと、中身を読まずに当てられてしまう
  lines.push(`${mark(maru > 0 && batsu > 0 && Math.abs(maru - batsu) <= items / 2)} ○と×の偏りが半数以内`);
  section("F. 判例○×のデータ整合", lines);
}

/* ══════ G. 多肢選択のデータ整合 ══════ */
{
  /* 意味が同じ語を撹乱肢にすると、判旨の理解ではなく判決文の丸暗記を問うことになる。
     文字列の包含では捕まらない組み合わせ（「非宗教的」と「世俗的」は共通する字が
     「的」だけ）があるので、実際に踏んだものを台帳にしておく。
     本試験の撹乱肢は「立法目的」に対する「立法目的達成手段」のように、
     語形は近いが意味は違う。 */
  const SYNONYMS = [
    ["根本目的", "本来的目的"], ["根本目的", "究極目的"], ["根本目的", "制度趣旨"],
    // 「非宗教的」と「世俗的」は台帳に入れない。世俗的は目的効果基準の語（津地鎮祭事件）で、
    // 総合考慮による孔子廟事件とはどちらの枠組みの語彙かという違いがある
    ["相当", "相応"], ["原則として", "原則的に"],
    ["差別的取扱い", "別異の取扱い"], ["罷免", "解職"], ["例示的列記", "例示列挙"],
    ["法廷意見", "多数意見"], ["賛同", "同調"], ["基準", "目的効果基準"], ["原審判決", "原判決"],
    // 「儒教」と「儒学」は台帳に入れない。宗教か学問かという区別そのものが論点で、
    // 判決も「宗教としての儒教の信仰」と書いている。ここは意味の違いを問えている
  ];
  const isSyn = (a, b) => SYNONYMS.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
  /* 「非宗教的」と「宗教的」は包含関係にあるが、意味は正反対で同義語ではない。
     打ち消しの接頭辞が付いただけの組み合わせは、包含の判定から除く */
  const isNeg = (a, b) => { const s = a.length < b.length ? a : b, l = a.length < b.length ? b : a;
    return ["非", "不", "無", "未"].some(p => l === p + s); };
  const lines = [];
  const listOf = h => Array.isArray(h.tashi) ? h.tashi : h.tashi ? [h.tashi] : [];
  const withT = HANREI.filter(h => listOf(h).length);
  for (const h of withT) for (const t of listOf(h)) {
    const B = t.blanks || [];
    const marks = [...t.passage.matchAll(/｛([^｝]+)｝/g)].map(m => m[1]);
    lines.push(`${mark(B.length >= 6)} ${h.id} 空欄の候補が6件以上（${B.length}件）`);
    // 候補が4件ちょうどだと毎回同じ4箇所になり、判旨の理解ではなく4語の暗記になる
    const uniq = [...new Set(marks)];
    lines.push(`${mark(uniq.length === B.length)} ${h.id} 本文の｛｝と blanks が一致（本文${uniq.length}語・${marks.length}箇所／定義${B.length}）`);
    lines.push(`${mark(B.every(b => marks.includes(b.word)))} ${h.id} 定義した語がすべて本文にある`);
    const all = B.flatMap(b => [b.word, ...(b.decoys || [])]);
    lines.push(`${mark(new Set(all).size === all.length)} ${h.id} 正解と撹乱肢に重複がない（${all.length}語）`);
    lines.push(`${mark(B.every(b => (b.decoys || []).length === 4))} ${h.id} 各空欄に撹乱肢が4語ずつ`);
    // どの4つを選んでも語群がちょうど20語になること
    lines.push(`${mark(B.every(b => (b.decoys || []).length === 4))} ${h.id} どの組合せでも語群は20語`);
    /* 同じ語が複数箇所にあるのは本試験と同じ形なので構わない。
       いけないのは、印を付けていない箇所が残ること。そこに答えが見えてしまう。 */
    const bare = t.passage.replace(/｛[^｝]+｝/g, "");
    const leak = B.filter(b => bare.includes(b.word));
    lines.push(`${mark(!leak.length)} ${h.id} 空欄の語が地の文に残っていない`
      + (leak.length ? `  <span class="ng">${esc(leak.map(b => b.word).join("／"))}</span>` : ""));
    lines.push(`${mark(B.every(b => b.why && b.why.length >= 30))} ${h.id} 空欄ごとの理由がある`);
    lines.push(`${mark(B.every(b => Number.isFinite(b.weight) && b.weight >= 1))} ${h.id} 重要度が付いている`);
    lines.push(`${mark(!!t.source)} ${h.id} 法廷意見か別意見かの別（${esc(t.source || "")}）`);
    lines.push(`${mark(t.passage.replace(/[｛｝]/g, "").length >= 120)} ${h.id} 本文が120字以上（${t.passage.replace(/[｛｝]/g, "").length}字）`);
    // 同義語を撹乱肢にすると、判旨の理解ではなく丸暗記を問うことになる
    /* 語群は4空欄で共有されるので、ある空欄のために作った撹乱肢が、別の空欄の正解の
       同義語になってしまうことがある（「多数意見」の撹乱肢に置いた「原判決」が、
       「原審判決」の空欄に流れ込んだ）。自分の撹乱肢だけでなく、
       この判例のすべての撹乱肢と突き合わせる。 */
    const allDecoys = B.flatMap(x => x.decoys || []);
    const near = B.filter(b => allDecoys.filter(d => d !== b.word).some(d =>
      isSyn(b.word, d) ||
      (!isNeg(b.word, d) && (d.length >= 2 && b.word.length >= 2) && (d.includes(b.word) || b.word.includes(d)))));
    lines.push(`${mark(!near.length)} ${h.id} 撹乱肢が正解を含む同義語になっていない`
      + (near.length ? `  <span class="ng">${esc(near.map(b => b.word).join("／"))}</span>` : ""));
    lines.push(`     <span class="dim">組合せ ${B.length}件から4件 = ${
      (n => { let c = 1; for (let i = 0; i < 4; i++) c = c * (n - i) / (i + 1); return Math.round(c); })(B.length)} 通り</span>`);
  }
  if (!withT.length) lines.push(`${mark(true)} 多肢選択のデータはまだない`);
  section("G. 多肢選択のデータ整合", lines);
}

/* ══════ まとめ ══════ */
const sum = document.getElementById("summary");
sum.className = ngCount ? "ng" : "ok";
sum.textContent = ngCount ? `FAIL ${ngCount} 件` : "すべて PASS";
</script>
