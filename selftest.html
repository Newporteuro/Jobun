import { CASES }     from "./js/cases.js?v=20260825a";
import { scoreCase } from "./js/drill.js?v=20260825a";

const out = document.getElementById("out");
let ngCount = 0;

const esc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function section(title, lines) {
  const h = document.createElement("h2"); h.textContent = title; out.append(h);
  const p = document.createElement("pre"); p.innerHTML = lines.join("\n"); out.append(p);
}
const mark = ok => { if (!ok) ngCount++; return ok ? `<span class="ok">PASS</span>` : `<span class="ng">FAIL</span>`; };

/* 各要素をなぜそう採ったのか。ui.js の reason() と同じ考え方 */
function why(d) {
  if (d.implied)          return `「${d.impliedFrom}」に含まれるものとして加点`;
  if (d.hit && d.match)   return `「${d.match.text}」が該当` +
                                 (d.match.how ? `（${d.match.how}照合）` : "") +
                                 (d.match.spread ? "（割り込みを許して照合）" : "");
  return "";
}
const brief = s => s.detail.map(d => (d.hit ? "○" : "×") + d.label).join("  ");

/* ══════ A. 解答例と別解は満点か（とりこぼし） ══════ */
{
  const lines = [];
  for (const c of CASES) {
    for (const [tag, text] of [["解答例", c.answer], ["別解", c.variant]]) {
      if (!text) continue;
      const s = scoreCase(text, c.points);
      if (s.pct < 100) lines.push(
        `${mark(false)} ${c.id} ${tag} ${s.earned}/${s.full}  落ち: ` +
        esc(s.detail.filter(d => !d.hit).map(d => d.label).join(" / ")));
    }
  }
  if (!lines.length) lines.push(`${mark(true)} 全 ${CASES.length} 問、解答例・別解ともに満点`);
  section("A. 解答例・別解の自己採点", lines);
}

/* ══════ B. impliedBy のラベルが実在するか ══════ */
{
  const lines = [];
  for (const c of CASES) {
    const labels = new Set(c.points.map(p => p.label));
    for (const p of c.points) {
      if (!p.impliedBy) continue;
      for (const l of p.impliedBy) {
        if (labels.has(l)) lines.push(`${mark(true)} ${c.id} 「${esc(p.label)}」 ← 「${esc(l)}」`);
        else               lines.push(`${mark(false)} ${c.id} 「${esc(p.label)}」の impliedBy「${esc(l)}」に対応する要素がない`);
      }
    }
  }
  if (!lines.length) lines.push(`<span class="dim">impliedBy を使っている要素はない</span>`);
  section("B. impliedBy のラベル整合", lines);
}

/* ══════ C. 中身のない解答で点が入らないか ══════ */
{
  const JUNK = ["わかりません。", "あああああああああああああああああああ",

    const worst = CASES.map(c => ({id: c.id, s: scoreCase(j, c.points)}))
                       .sort((a, b) => b.s.pct - a.s.pct)[0];
    return `${mark(worst.s.pct <= 40)} 最大 ${worst.s.earned}/${worst.s.full} (${worst.id})  ${esc(j)}`;
  });
  section("C. 無関係な解答", lines);
}

  // 事情裁決（行政不服審査法45条3項）── 理由があるのに棄却する例外
  ["fufuku-45",   "審査請求を認容して処分を取り消さなければならない。", 0, 0],
  ["fufuku-45",   "審査請求を棄却するが、主文で違法であることを宣言する必要はない。", 0, 9],
  ["fufuku-45",   "事情裁決により棄却し、主文において当該処分が違法である旨を明示する。", 20, 20],
];
{
  const lines = [];
  for (const [id, text, min, max] of PROBES) {
    const c = CASES.find(x => x.id === id);
    if (!c) { lines.push(`${mark(false)} ${id} が見つからない`); continue; }
    const s = scoreCase(text, c.points);
    const ok = s.earned >= min && s.earned <= max;
    lines.push(`${mark(ok)} ${id} ${s.earned}/${s.full}` +
               (ok ? "" : `  <span class="ng">（期待 ${min}〜${max}）</span>`));
    lines.push(`     <span class="dim">${esc(text)}</span>`);
    for (const d of s.detail) {
      const w = why(d);
      lines.push(`     ${d.hit ? "○" : "×"} ${esc(d.label)} (${d.hit ? d.point : 0}/${d.point})` +
                 (w ? `  <span class="dim">${esc(w)}</span>` : ""));
    }
  }
  section("D. 誤答・正答プローブ", lines);
}

/* ══════ E. 他問の解答で点が入る要素（緩い語の目安） ══════ */
{
  const corpus = [];
  for (const c of CASES) {
    if (c.answer)  corpus.push({id: c.id, text: c.answer});
    if (c.variant) corpus.push({id: c.id, text: c.variant});
  }
  const rows = [];
  for (const c of CASES) {
    for (const p of c.points) {
      const hits = new Set();
      for (const src of corpus) {
        if (src.id === c.id) continue;
        if (scoreCase(src.text, [p]).earned > 0) hits.add(src.id);
      }
      if (hits.size >= 3) rows.push({n: hits.size, id: c.id, label: p.label, pt: p.point, hits});
    }
  }
  rows.sort((a, b) => b.n - a.n);
  const lines = rows.length
    ? [`<span class="dim">他問の解答例・別解 ${corpus.length} 本のうち、3問以上で当たってしまう要素。`
       + `その問題を解いている限りは実害が出ないこともあるが、語が緩い目安になる。</span>`]
       .concat(rows.map(r => `  [${r.n}問] ${r.id} 「${esc(r.label)}」 ${r.pt}点`))
    : [`${mark(true)} 3問以上に当たる要素はない`];
  section("E. 語が緩い要素の目安", lines);
}

/* ══════ まとめ ══════ */
const sum = document.getElementById("summary");
sum.className = ngCount ? "ng" : "ok";
sum.textContent = ngCount ? `FAIL ${ngCount} 件` : "すべて PASS";
</script>
